[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "rf-link-calculator"
version = "2.3.0"
description = "中文射频链路预算、数据驱动模型与对标验证"
requires-python = ">=3.11"
dependencies = ["streamlit>=1.49,<2", "numpy>=2,<3", "pandas>=2.2,<4", "openpyxl>=3.1,<4", "graphviz>=0.20,<1", "jsonschema>=4.23,<5", "scipy>=1.14,<2", "scikit-rf>=2.0,<3"]

[project.optional-dependencies]
portal = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "argon2-cffi>=23,<26"]
desktop = ["pywebview>=6,<7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rf_link_calculator = ["project-v1.schema.json", "project-v2.schema.json", "presentation/web/*.html", "presentation/web/*.css", "presentation/web/*.js", "presentation/web/*.svg", "presentation/web/*.png"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
ignore = ["E731"]
