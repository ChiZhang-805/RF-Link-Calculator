<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RF Link · 登录</title><link rel="stylesheet" href="/auth.css"><script src="/auth.js" defer></script></head>
<body><main class="auth-shell"><section class="identity"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M1 12h4l3-8 4 16 3-12 3 4h5"/></svg><h1>RF Link</h1><h2>射频链路工作台</h2><div class="signal-art" aria-hidden="true"><span></span><i></i><span></span><i></i><span></span></div></section><section class="auth-card"><nav aria-label="账户入口"><button data-mode="login" class="active">登录</button><button data-mode="register">注册</button></nav><form id="auth-form"><h2 id="form-title">登录</h2><label id="email-row">邮箱<input type="email" id="email" autocomplete="username" required maxlength="254"></label><label id="key-row" hidden>恢复密钥<input id="key" autocomplete="off" maxlength="100"></label><label id="password-row">密码<input type="password" id="password" autocomplete="current-password" minlength="12" maxlength="128" required></label><label id="confirm-row" hidden>确认密码<input type="password" id="confirm" autocomplete="new-password" maxlength="128"></label><p id="message" role="status"></p><button type="submit" id="submit" class="primary">登录</button><div id="recovery-row" hidden><label>恢复密钥<input id="recovery" readonly></label><button type="button" id="copy-recovery">复制密钥</button><button type="button" data-mode="login">返回登录</button></div><div class="links"><button type="button" data-mode="forgot">找回密码</button><button type="button" data-mode="resend" id="resend" hidden>重发验证邮件</button><button type="button" data-mode="login" id="back" hidden>返回登录</button></div></form></section></main></body></html>
