<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>RF Link · 登录</title>
  <link rel="stylesheet" href="auth.css">
  <script src="auth.js" defer></script>
</head>
<body>
  <main class="auth-shell">
    <section class="identity">
      <div class="brand">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M1 12h4l3-8 4 16 3-12 3 4h5"/></svg>
        <span>RF Link</span>
      </div>
      <div class="headline">
        <h1>射频链路工作台</h1>
        <p>一款AI赋能的射频智能设计与优化软件。</p>
      </div>
    </section>

    <section class="auth-card">
      <div class="auth-head">
        <h2 id="form-title">登录</h2>
        <nav aria-label="账户入口">
          <button type="button" data-mode="login" class="mode-tab active">登录</button>
          <button type="button" data-mode="register" class="mode-tab">注册</button>
          <button type="button" data-mode="login" id="nav-back" hidden>返回登录</button>
        </nav>
      </div>

      <form id="auth-form">
        <label id="email-row">邮箱
          <input type="email" id="email" autocomplete="username" required maxlength="254">
        </label>
        <label id="code-row" hidden>验证码
          <span class="code-line">
            <input id="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6">
            <button type="button" id="send-code">获取验证码</button>
          </span>
        </label>
        <label id="key-row" hidden>恢复密钥
          <input id="key" autocomplete="off" maxlength="100">
        </label>
        <label id="password-row">密码
          <input type="password" id="password" autocomplete="current-password" minlength="12" maxlength="128" required>
        </label>
        <label id="confirm-row" hidden>确认密码
          <input type="password" id="confirm" autocomplete="new-password" maxlength="128">
        </label>
        <div class="row-tools" id="auth-tools">
          <label class="remember"><input type="checkbox" checked>保持登录</label>
          <button type="button" data-mode="forgot">找回密码</button>
        </div>
        <p id="message" role="status"></p>
        <button type="submit" id="submit" class="primary">登录</button>
        <div id="recovery-row" hidden>
          <label>恢复密钥
            <input id="recovery" readonly>
          </label>
          <div class="recovery-actions">
            <button type="button" id="copy-recovery">复制密钥</button>
            <button type="button" data-mode="login">返回登录</button>
          </div>
        </div>
        <div class="links">
          <button type="button" data-mode="resend" id="resend" hidden>重发验证邮件</button>
          <button type="button" data-mode="login" id="back" hidden></button>
        </div>
      </form>

      <div class="social-logins" aria-label="第三方登录">
        <button type="button" class="social-login" data-provider="支付宝" aria-label="支付宝登录" title="支付宝登录">
          <img src="brand-alipay.svg" alt="">
        </button>
        <button type="button" class="social-login" data-provider="微信" aria-label="微信登录" title="微信登录">
          <img src="brand-wechat.svg" alt="">
        </button>
        <button type="button" class="social-login" data-provider="GitHub" aria-label="GitHub 登录" title="GitHub 登录">
          <img src="brand-github.svg" alt="">
        </button>
      </div>
    </section>
  </main>
</body>
</html>
